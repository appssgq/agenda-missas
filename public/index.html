<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Missas</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      background:#f4f6f8;
      color:#222;
    }

    header{
      background:#6b3f22;
      color:white;
      padding:22px;
      text-align:center;
    }

    header h1{
      margin:0;
      font-size:26px;
    }

    header p{
      margin:6px 0 0;
      font-size:14px;
      opacity:.9;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    h2{
      margin-top:0;
      font-size:20px;
    }

    label{
      display:block;
      margin-top:14px;
      margin-bottom:6px;
      font-weight:bold;
    }

    input, textarea{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    textarea{
      min-height:75px;
      resize:vertical;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      border-radius:9px;
      background:#6b3f22;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    .missa{
      border-bottom:1px solid #ddd;
      padding:14px 0;
    }

    .missa:last-child{
      border-bottom:none;
    }

    .data{
      font-weight:bold;
      font-size:17px;
    }

    .local{
      margin-top:5px;
    }

    .obs{
      margin-top:5px;
      color:#666;
      font-size:14px;
    }

    .status{
      margin-top:12px;
      text-align:center;
      font-weight:bold;
    }

    .vazio{
      text-align:center;
      color:#777;
      padding:20px;
    }
  </style>
</head>

<body>

<header>
  <h1>⛪ Agenda de Missas</h1>
  <p>Cadastro e controle das próximas missas</p>
</header>

<div class="container">

  <div class="card">

    <h2>Nova Missa</h2>

    <label>Data</label>
    <input type="date" id="data">

    <label>Horário</label>
    <input type="time" id="horario">

    <label>Local</label>
    <input type="text" id="local" placeholder="Ex.: Capela São José">

    <label>Observação</label>
    <textarea id="observacao" placeholder="Opcional"></textarea>

    <button id="btnSalvar" onclick="salvarMissa()">
      Salvar Missa
    </button>

    <div class="status" id="status"></div>

  </div>

  <div class="card">

    <h2>Próximas Missas</h2>

    <div id="lista">
      <div class="vazio">Carregando...</div>
    </div>

  </div>

</div>

<script>

async function salvarMissa(){

  const data = document.getElementById("data").value;
  const horario = document.getElementById("horario").value;
  const local = document.getElementById("local").value.trim();
  const observacao = document.getElementById("observacao").value.trim();

  if(!data || !horario || !local){
    mostrarStatus("Preencha data, horário e local.", false);
    return;
  }

  const botao = document.getElementById("btnSalvar");

  botao.disabled = true;
  botao.innerText = "Salvando...";

  try{

    const resposta = await fetch("/api/missas",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        data_missa:data,
        horario:horario,
        local:local,
        observacao:observacao
      })
    });

    const dados = await resposta.json();

    if(!resposta.ok){
      throw new Error(dados.erro || "Erro ao salvar");
    }

    document.getElementById("data").value="";
    document.getElementById("horario").value="";
    document.getElementById("local").value="";
    document.getElementById("observacao").value="";

    mostrarStatus("✅ Missa cadastrada com sucesso!", true);

    carregarMissas();

  }catch(erro){

    mostrarStatus("❌ "+erro.message, false);

  }finally{

    botao.disabled=false;
    botao.innerText="Salvar Missa";

  }
}

async function carregarMissas(){

  const lista = document.getElementById("lista");

  try{

    const resposta = await fetch("/api/missas");

    const missas = await resposta.json();

    if(!resposta.ok){
      throw new Error("Erro ao carregar");
    }

    if(!missas.length){

      lista.innerHTML =
        '<div class="vazio">Nenhuma missa cadastrada.</div>';

      return;
    }

    lista.innerHTML = "";

    missas.forEach(missa=>{

      const data = missa.data_missa.split("-");

      const dataBR =
        data[2]+"/"+data[1]+"/"+data[0];

      const horario =
        String(missa.horario || "").slice(0,5);

      lista.innerHTML += `
        <div class="missa">

          <div class="data">
            📅 ${dataBR} às ${horario}
          </div>

          <div class="local">
            📍 ${missa.local}
          </div>

          ${
            missa.observacao
            ? `<div class="obs">📝 ${missa.observacao}</div>`
            : ""
          }

        </div>
      `;

    });

  }catch(erro){

    lista.innerHTML =
      '<div class="vazio">Erro ao carregar as missas.</div>';

  }
}

function mostrarStatus(texto, sucesso){

  const status = document.getElementById("status");

  status.innerText = texto;

  status.style.color =
    sucesso ? "green" : "red";

}

carregarMissas();

</script>

</body>
  </html>
